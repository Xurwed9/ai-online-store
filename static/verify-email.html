<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — AI Store</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')</script>
</head>
<body>
  <div class="page-wrapper">
    <nav class="navbar">
      <a href="/" class="navbar-brand">
        <div class="navbar-logo">AI</div>
        <span class="navbar-title">AI Store</span>
      </a>
      <div class="navbar-links" id="auth-links"></div>
    </nav>

    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-icon yellow">&#9993;</div>
          <h1 class="auth-title">Verify Email</h1>
          <p class="auth-subtitle">Enter the code we sent to your email</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="verifyForm" onsubmit="handleVerify(event)">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Verification Code</label>
            <input type="text" class="form-input" id="code" placeholder="Enter your code" required>
          </div>
          <button type="submit" class="btn btn-primary" id="verifyBtn">
            <span class="btn-text">Verify Email</span>
            <div class="spinner"></div>
          </button>
        </form>

        <div class="divider">or</div>

        <p class="auth-link">
          Already verified? <a href="/static/login.html">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    updateNavbar();

    async function handleVerify(e) {
      e.preventDefault();
      hideAlert('alert');
      setLoading('verifyBtn', true);

      try {
        const data = await apiRequest('/auth/verify-email', {
          method: 'POST',
          json: {
            email: document.getElementById('email').value,
            code: document.getElementById('code').value
          }
        });
        showAlert('alert', data.message || 'Email verified!', 'success');
        showToast('Email verified! Redirecting...');
        setTimeout(() => { window.location.href = '/static/login.html'; }, 2000);
      } catch (err) {
        showAlert('alert', err?.data?.detail || 'Verification failed');
      } finally {
        setLoading('verifyBtn', false);
      }
    }
  </script>
</body>
</html>
