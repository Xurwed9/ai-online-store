<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — AI Store</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')</script>
</head>
<body>
  <div class="page-wrapper">
    <nav class="navbar">
      <a href="/" class="navbar-brand">
        <div class="navbar-logo">AI</div>
        <span class="navbar-title">AI Store</span>
      </a>
      <div class="navbar-links" id="auth-links"></div>
    </nav>

    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-icon">&#9997;</div>
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">Join our fashion community today</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="username" placeholder="min 5 characters" required minlength="5" maxlength="30">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-input" id="phone" placeholder="+998 XX XXX XX XX" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="password" placeholder="min 6 characters" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary" id="registerBtn">
            <span class="btn-text">Create Account</span>
            <div class="spinner"></div>
          </button>
        </form>

        <div class="divider">or</div>

        <p class="auth-link">
          Already have an account? <a href="/static/login.html">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
  <script>
    updateNavbar();
    if (isLoggedIn()) window.location.href = '/static/admin-dashboard.html';

    async function handleRegister(e) {
      e.preventDefault();
      hideAlert('alert');
      setLoading('registerBtn', true);

      try {
        await apiRequest('/auth/register', {
          method: 'POST',
          json: {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            phone_number: document.getElementById('phone').value,
            password: document.getElementById('password').value,
            role: 'user'
          }
        });
        showToast('Account created! Check your email');
        setTimeout(() => { window.location.href = '/static/verify-email.html'; }, 1200);
      } catch (err) {
        showAlert('alert', err?.data?.detail || 'Registration failed');
      } finally {
        setLoading('registerBtn', false);
      }
    }
  </script>
</body>
</html>
